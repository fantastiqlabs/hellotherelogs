name: Build and publish container images

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request_target:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  choose-runner:
    uses: ./.github/workflows/select-runner.yml
    with:
      hosted_budget_minutes: ${{ vars.ACTIONS_HOSTED_BUDGET_MINUTES }}
      hosted_reserve_minutes: ${{ vars.ACTIONS_HOSTED_RESERVE_MINUTES }}
    secrets:
      ACTIONS_BILLING_TOKEN: ${{ secrets.ACTIONS_BILLING_TOKEN }}

  validate-build:
    needs: choose-runner
    if: github.event_name == 'pull_request_target' || (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main')
    runs-on: ${{ fromJSON(needs.choose-runner.outputs.runs_on) }}
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate Unraid Compose configuration
        run: docker compose --env-file .env.unraid.example -f docker-compose.unraid.yml config --quiet

      - name: Record frontend build time
        id: build_info
        run: echo "date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build backend image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/amd64
          push: false

      - name: Build frontend image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          platforms: linux/amd64
          push: false
          build-args: |
            VITE_APP_VERSION=${{ github.sha }}
            VITE_APP_BUILD_DATE=${{ steps.build_info.outputs.date }}

  publish:
    needs: choose-runner
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ${{ fromJSON(needs.choose-runner.outputs.runs_on) }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Record frontend build time
        id: build_info
        run: echo "date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare backend image metadata
        id: backend_meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/fantastiqlabs/hellotherelogs-backend
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=long
            type=ref,event=tag

      - name: Build and publish backend
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.backend_meta.outputs.tags }}
          labels: ${{ steps.backend_meta.outputs.labels }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Prepare frontend image metadata
        id: frontend_meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/fantastiqlabs/hellotherelogs-frontend
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=long
            type=ref,event=tag

      - name: Build and publish frontend
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.frontend_meta.outputs.tags }}
          labels: ${{ steps.frontend_meta.outputs.labels }}
          build-args: |
            VITE_APP_VERSION=${{ github.sha }}
            VITE_APP_BUILD_DATE=${{ steps.build_info.outputs.date }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  announce-discord:
    needs: [choose-runner, publish]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.publish.result == 'success'
    runs-on: ${{ fromJSON(needs.choose-runner.outputs.runs_on) }}
    steps:
      - name: Post changelog card
        shell: bash
        env:
          FANTASTIQLABS_DISCORD_WEBHOOK: "${{ secrets.FANTASTIQLABS_DISCORD_WEBHOOK }}"
          GITHUB_TOKEN: "${{ github.token }}"
          GITHUB_REPOSITORY: "${{ github.repository }}"
          GITHUB_RUN_ID: "${{ github.run_id }}"
          PROJECT_NAME: "Hello There Logs"
          COMMIT_SHA: "${{ github.sha }}"
          COMMIT_URL: "https://github.com/${{ github.repository }}/commit/${{ github.sha }}"
        run: |
          set -euo pipefail

          if [[ -z "$FANTASTIQLABS_DISCORD_WEBHOOK" ]]; then
            echo "Discord webhook secret is empty." >&2
            exit 1
          fi

          short_sha="${COMMIT_SHA:0:12}"
          headers=(-H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28')
          current_run="$(curl --fail --silent --show-error \
            --connect-timeout 10 --max-time 30 \
            "${headers[@]}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}")"
          workflow_id="$(jq -er '.workflow_id' <<<"$current_run")"
          successful_runs="$(curl --fail --silent --show-error \
            --connect-timeout 10 --max-time 30 \
            "${headers[@]}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow_id}/runs?branch=main&status=success&per_page=100")"
          previous_sha="$(jq -r --argjson current "$GITHUB_RUN_ID" \
            '[.workflow_runs[] | select(.id < $current) | .head_sha][0] // empty' \
            <<<"$successful_runs")"

          if [[ -n "$previous_sha" && "$previous_sha" != "$COMMIT_SHA" ]]; then
            comparison="$(curl --fail --silent --show-error \
              --connect-timeout 10 --max-time 30 \
              "${headers[@]}" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/compare/${previous_sha}...${COMMIT_SHA}")"
            changelog="$(jq -r '[.commits[] | .commit.message | split("\n")[0] | .[:140] | "- " + .] | .[-15:] | join("\n")' <<<"$comparison")"
            if [[ -z "$changelog" ]]; then
              changelog="No source changes were detected since the previous image build."
            fi
          elif [[ -n "$previous_sha" ]]; then
            changelog="No source changes were detected since the previous image build."
          else
            changelog="First image build for this workflow. See the source commit below."
          fi

          description="$(printf 'Changes since the previous image build:\n\n%s' "$changelog")"
          description="${description:0:3800}"
          payload="$(jq -n \
            --arg project "$PROJECT_NAME" \
            --arg sha "$short_sha" \
            --arg commit_url "$COMMIT_URL" \
            --arg description "$description" \
            '{embeds:[{title:($project+" update"),url:$commit_url,description:$description,color:5793266,fields:[{name:"Source commit",value:("["+$sha+"]("+$commit_url+")"),inline:true}],footer:{text:"GHCR image published • deployment status is separate"}}],allowed_mentions:{parse:[]}}')"

          set +e
          status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --connect-timeout 10 --max-time 30 \
            --header 'Content-Type: application/json' \
            --data-binary "$payload" \
            "$FANTASTIQLABS_DISCORD_WEBHOOK" 2>/dev/null)"
          curl_status=$?
          set -e

          if [[ $curl_status -ne 0 || ! "$status" =~ ^2[0-9][0-9]$ ]]; then
            echo "Discord image announcement failed (HTTP ${status:-no response}); webhook URL was withheld." >&2
            exit 1
          fi
