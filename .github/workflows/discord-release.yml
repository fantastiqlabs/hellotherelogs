name: Announce published releases

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  announce:
    uses: ./.github/workflows/discord-release-reusable.yml
    with:
      project_name: "Logtastiq"
    secrets:
      FANTASTIQLABS_DISCORD_WEBHOOK: ${{ secrets.FANTASTIQLABS_DISCORD_WEBHOOK }}
